<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI-DS Visualizer Pro banner</title>
  <desc id="desc">A dark futuristic network of data structure nodes, code lines, and visualization bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.55" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="70" y1="80" x2="450" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="purple" x1="1050" y1="90" x2="1450" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#38BDF8" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="28" fill="url(#grid)"/>
  <path d="M0 410C250 330 360 480 590 380C820 280 960 420 1160 300C1320 205 1450 275 1600 210" stroke="#22D3EE" stroke-opacity="0.12" stroke-width="2"/>
  <g stroke="url(#cyan)" stroke-opacity="0.42" stroke-width="2">
    <path d="M110 170L270 90L405 205L270 340L110 260L110 170Z"/>
    <path d="M270 90L270 340M110 170L405 205M110 260L405 205"/>
    <path d="M1140 120L1320 205L1465 120M1140 120L1230 350L1465 390L1320 205L1230 350M1320 205L1465 390"/>
  </g>
  <g fill="#050914" stroke="#22D3EE" stroke-width="4" filter="url(#glow)">
    <circle cx="110" cy="170" r="11"/><circle cx="270" cy="90" r="11"/><circle cx="405" cy="205" r="11"/><circle cx="270" cy="340" r="11"/><circle cx="110" cy="260" r="11"/>
    <circle cx="1140" cy="120" r="11"/><circle cx="1320" cy="205" r="11"/><circle cx="1465" cy="120" r="11"/><circle cx="1230" cy="350" r="11"/><circle cx="1465" cy="390" r="11"/>
  </g>
  <g transform="translate(1060 320)">
    <rect x="0" y="72" width="34" height="56" rx="6" fill="#22D3EE" fill-opacity="0.8"/>
    <rect x="48" y="38" width="34" height="90" rx="6" fill="#38BDF8" fill-opacity="0.8"/>
    <rect x="96" y="6" width="34" height="122" rx="6" fill="#6366F1" fill-opacity="0.8"/>
    <rect x="144" y="54" width="34" height="74" rx="6" fill="#8B5CF6" fill-opacity="0.8"/>
    <path d="M0 142H204" stroke="#CBD5E1" stroke-opacity="0.25"/>
  </g>
  <g transform="translate(510 90)">
    <rect width="530" height="270" rx="18" fill="#050914" fill-opacity="0.74" stroke="#24344A"/>
    <circle cx="28" cy="28" r="5" fill="#EF4444"/><circle cx="48" cy="28" r="5" fill="#F59E0B"/><circle cx="68" cy="28" r="5" fill="#22C55E"/>
    <g font-family="monospace" font-size="16">
      <text x="32" y="78" fill="#8B5CF6">const</text><text x="90" y="78" fill="#F8FAFC">visualize</text><text x="184" y="78" fill="#CBD5E1">=</text><text x="204" y="78" fill="#22D3EE">(steps)</text><text x="282" y="78" fill="#CBD5E1">=&gt; {</text>
      <text x="56" y="112" fill="#38BDF8">return</text><text x="130" y="112" fill="#CBD5E1">steps.map(step =&gt; render(step));</text>
      <text x="32" y="146" fill="#CBD5E1">};</text>
      <text x="32" y="196" fill="#64748B">// learn by seeing every state change</text>
      <text x="32" y="232" fill="#22D3EE">AI-DS Visualizer Pro</text>
    </g>
  </g>
  <text x="800" y="455" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="5">VISUALIZE • EXECUTE • UNDERSTAND</text>
</svg>
